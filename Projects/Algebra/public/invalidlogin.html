<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Smooch+Sans:wght@100..900&display=swap');

        *{
            margin: 0;
            padding:0;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            background:url(/68275856f8f042c7d3d6e0a9_largeheader_whitebranding.png);
            background-size: cover;
            background-position: 100% 0%;
            height: 100vh;
            width:100vw;
            overflow: hidden;
        }
        .container{
            height: 100vh;
            width: 100vw;
            background: rgba(0, 0, 0, 0);
            border: 1px solid black;
            

            
        }
        .heading{
            color:rgb(126,0,12);
            font-family: "Smooch Sans", sans-serif;
            font-optical-sizing: auto;
            font-weight: 800;
            font-style: normal;
            font-size: 80px;
            text-align: left;
            padding: 20px;
            animation: animate 1s ease-in-out 1;

        }
        .heading2{
            color: rgb(126,0,12);
            font-family: "Smooch Sans", sans-serif;
            font-optical-sizing: auto;
            font-weight: 800;
            font-style: normal;
            font-size: 120px;
            text-align: left;
            padding: 20px;
            animation: animate 3s ease-in-out 1;

        }
        .back{
            color: rgb(126,0,12);
            font-family: "Smooch Sans", sans-serif;
            font-optical-sizing: auto;
            font-weight: 300;
            font-style: normal;
            font-size: 25px;
            text-align: center;
            padding: 20px;
            margin-top: 20rem;
            animation: animate 3s ease-in-out 1;
            transform: scale(1);
            transition-duration: 0.3s;
        }
        a{
            color:rgb(126,0,12);
            text-decoration: none;
            
        }

        .back:hover{
            transform: scale(1.2);
        }
        @keyframes animate{
            0%{
                opacity:0;
            }
            100%{
                opacity:1;
            }
        }
        
    </style>
    <script src="https://kit.fontawesome.com/0e66e07bd2.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
        <div class="heading">Error : 404</div>
        <div class="heading2">Invalid Credentials</div>
        <div class="back"><a href="/">Back to Home&nbsp;&nbsp;<i class="fa-solid fa-house"></i></a></div>
    </div>
    
</body>
</html>
